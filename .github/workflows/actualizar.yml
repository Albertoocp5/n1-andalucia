name: Actualizar datos de Afición FAB

# Lunes 08:00, fines de semana cada hora de 11:00 a 23:00 y entre semana de 18:00 a 22:00
# (hora de Madrid en invierno). Si hay partidos en juego, cada ejecución se queda en marcha
# publicando el directo cada ~5 minutos hasta que llega la siguiente.
on:
  schedule:
    # Minutos sueltos (no en punto): GitHub retrasa o se salta muchas ejecuciones a en punto.
    - cron: "7 7 * * 1"
    - cron: "7,37 10-22 * * 0,5,6"
    - cron: "7,37 17-21 * * 1-4"
  workflow_dispatch:
  # también al subir cambios de código (no de datos), para probar en el momento
  push:
    branches: [main]
    paths-ignore: ["docs/**", "datos-fab-vivo/**", "*.md", "*.pdf"]

permissions:
  contents: write

concurrency:
  group: actualizar-fab
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La sesión de invitado de Afición FAB se conserva entre ejecuciones en la caché
      # de Actions (nunca en el repositorio), para no registrar un dispositivo nuevo cada vez.
      - name: Recuperar sesión FAB
        uses: actions/cache@v4
        with:
          path: captura-app/.sesion-fab.json
          key: sesion-fab-${{ github.run_id }}
          restore-keys: sesion-fab-

      - name: Arrancar la web local de trabajo
        working-directory: web-en-progreso
        run: |
          node scripts/build.mjs
          nohup node dev/serve.mjs --seed > ../servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8787/ && break; sleep 1; done

      - name: Descargar calendario, actas y jugadas
        working-directory: captura-app
        run: python3 recolectar.py ../datos-fab-vivo

      - name: Validar, cargar y calcular la estadística avanzada
        working-directory: web-en-progreso
        env:
          N1_SITE: http://localhost:8787
          N1_TOKEN_FILE: .fab-import-token-local
          N1_PAUSA: "0"
        run: |
          mkdir -p ../salidas
          python3 scripts/cargar-fab.py ../datos-fab-vivo --publicar
          python3 scripts/avanzadas.py ../datos-fab-vivo ../salidas/avanzadas.json --sitio http://localhost:8787 --publicar

      - name: Exportar la web estática
        working-directory: web-en-progreso
        run: node dev/exportar.mjs ../docs

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos-fab-vivo docs
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos Afición FAB $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # Seguimiento en directo: mientras haya partidos en juego (o a punto de empezar), repite
      # descarga, carga, exportación y publicación cada ~5 minutos hasta que no quedan partidos
      # (máximo ~5 horas por ejecución, por si GitHub se salta las programadas). GitHub Pages admite unas 10 publicaciones por hora.
      - name: Directo de la jornada
        env:
          N1_SITE: http://localhost:8787
          N1_TOKEN_FILE: .fab-import-token-local
          N1_PAUSA: "0"
        run: |
          inicio=$(date +%s)
          while [ "$(python3 captura-app/hay_directo.py datos-fab-vivo/calendario.json)" = si ]; do
            [ $(( $(date +%s) - inicio )) -lt 17400 ] || { echo "Fin de esta ejecución; sigue la próxima"; break; }
            sleep 270
            echo "== Directo $(date -u +%H:%M:%S)"
            ( cd captura-app && python3 recolectar.py ../datos-fab-vivo ) || { echo "Afición FAB no responde; reintento"; continue; }
            ( cd web-en-progreso \
              && python3 scripts/cargar-fab.py ../datos-fab-vivo --publicar \
              && python3 scripts/avanzadas.py ../datos-fab-vivo ../salidas/avanzadas.json --sitio http://localhost:8787 --publicar \
              && node dev/exportar.mjs ../docs ) || { echo "Fallo al procesar; reintento"; continue; }
            git add datos-fab-vivo docs
            git diff --cached --quiet && continue
            git commit -q -m "Directo Afición FAB $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q || echo "No se pudo publicar; reintento"
          done
